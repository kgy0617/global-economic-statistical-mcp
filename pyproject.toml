[project]
name = "global-economic-statistical-mcp"
version = "0.5.1"
description = "AI-native MCP interface for discovering, retrieving, comparing and analysing trusted macroeconomic statistics across central banks and international organisations (Bank of Korea ECOS, OECD, IMF, BIS, ECB, Eurostat, World Bank)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "kgy0617", email = "35395723+kgy0617@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "macroeconomics", "economic-research", "sdmx", "oecd", "imf", "bis", "ecb", "eurostat", "world-bank", "ecos", "bank-of-korea", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp[cli]>=2.0,<3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.12",
]

[project.urls]
Homepage = "https://github.com/kgy0617/global-economic-statistical-mcp"
Repository = "https://github.com/kgy0617/global-economic-statistical-mcp"
Issues = "https://github.com/kgy0617/global-economic-statistical-mcp/issues"

[project.scripts]
global-economic-statistical-mcp = "global_economic_statistical_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "jsonschema>=4.18",
    "rfc3339-validator>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls the real ECOS, OECD, IMF, BIS, ECB, Eurostat and World Bank APIs (run with: uv run pytest -m live)",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
