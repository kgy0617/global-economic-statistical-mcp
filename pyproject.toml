[project]
name = "ecos-mcp"
version = "0.3.0"
description = "MCP server for Bank of Korea ECOS (Economic Statistics System) Open API with an SDMX view of its metadata"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "kgy0617", email = "35395723+kgy0617@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "ecos", "bank-of-korea", "economics", "statistics", "sdmx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp[cli]>=2.0,<3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.12",
]

[project.urls]
Homepage = "https://github.com/kgy0617/ecos_mcp"
Repository = "https://github.com/kgy0617/ecos_mcp"
Issues = "https://github.com/kgy0617/ecos_mcp/issues"

[project.scripts]
ecos-mcp = "ecos_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "jsonschema>=4.18",
    "rfc3339-validator>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls the real ECOS API (run with: uv run pytest -m live)",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
