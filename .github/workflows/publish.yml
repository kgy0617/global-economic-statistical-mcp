name: Publish to PyPI

# Requires a PyPI "trusted publisher" configured for this repository and workflow:
# https://docs.pypi.org/trusted-publishers/
on:
  release:
    types: [ published ]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - run: uv sync --locked

      - name: Check release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(uv run python -c "import importlib.metadata as m; print(m.version('ecos-mcp'))")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match pyproject version '$VERSION'"
            exit 1
          fi

      - run: uv run pytest

      - run: uv build

      - run: uv publish --trusted-publishing always
